{% extends "base.html" %}{% block content %}<h2>Rooms</h2>
<div class="card"><form method="post"><input name="number" placeholder="Room no." required>
<select name="type"><option>Single</option><option>Double</option><option>Suite</option></select>
<input name="price" type="number" step="0.01" placeholder="Price/night" required><button>Add room</button></form></div>
<div class="card"><table><tr><th>Room</th><th>Type</th><th>Price</th><th>Status</th><th></th></tr>
{% for r in rooms %}<tr><td>{{ r.number }}</td><td>{{ r.type }}</td><td>${{ '%.2f'|format(r.price) }}</td>
<td>{{ 'Occupied' if r.occupied else 'Available' }}</td>
<td><form class="inline" method="post" action="{{ url_for('delete_room', rid=r.id) }}"><button class="red">Delete</button></form></td></tr>{% endfor %}
</table></div>{% endblock %}
